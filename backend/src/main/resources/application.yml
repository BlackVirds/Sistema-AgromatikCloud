spring:
  datasource:
    url: jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:agromatik_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQLUSER:root}
    password: ${MYSQLPASSWORD:$@lano12}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  #Evitar errores en la nube
  # data:
  #   redis:
  #     host: ${REDISHOST:localhost}
  #     port: ${REDISPORT:6379}

server:
  port: ${PORT:8080}

app:
  jwt:
    #Lee la variable JWT_SECRET de Railway
    secret: ${JWT_SECRET:9a8f7g6h5j4k3l2z1x0c9v8b7n6m5QWERTYUIOPASDFGHJKL}
    expiration-ms: 86400000

  #Lee la variable APP_API_KEY de Railway
  api-key: ${APP_API_KEY:AgromatikSecureKeyForSensorsOnly}
